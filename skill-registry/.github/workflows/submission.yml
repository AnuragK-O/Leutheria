# Screens a skill submission PR and merges, labels or closes it.
#
# pull_request_target, because submissions come from forks and the screener
# needs ANTHROPIC_API_KEY and the job needs to merge. That trigger runs with
# secrets, so NOTHING from the PR is executed: the scripts come from the base
# commit (base/), the PR tree is checked out only as data (pr/, before/), and every
# PR-derived value reaches a shell through env, never ${{ }} interpolation.
name: submission

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screen:
    # A label is only a request to check for an approval (human_approval.py
    # binds it to an approving review of this exact head commit); the label
    # itself never approves anything.
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'human-approved' ||
      github.event.label.name == 'human-approved-override'
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.act.outputs.merged }}
    env:
      PR: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      LABEL: ${{ github.event.action == 'labeled' && github.event.label.name || '' }}
    steps:
      # An approval was for the commit a maintainer read; a new push makes
      # it stale, so the approval labels go with it.
      - name: A new push voids approval labels
        if: github.event.action == 'synchronize'
        run: |
          for label in human-approved human-approved-override; do
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
          done

      - name: Checkout base (trusted scripts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # GitHub's test merge of the PR into main, so a fork branched from an
      # older main isn't read as deleting what was published since. Its first
      # parent is the "before" tree; its second must be the head we screen.
      - name: Checkout the PR merge (data only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 2
          persist-credentials: false

      - name: Stage the before tree
        run: |
          test "$(git -C pr rev-parse HEAD^2)" = "$HEAD_SHA" || { echo "merge ref is not the PR head yet"; exit 1; }
          git -C pr worktree add --quiet --detach ../before HEAD^1

      - name: Read pinned Leutheria ref
        id: pin
        run: echo "ref=$(tr -cd '0-9a-f' < base/LEUTHERIA_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout Leutheria at the pinned ref (validate.py + tool catalog)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: AnuragK-O/Leutheria
          ref: ${{ steps.pin.outputs.ref }}
          path: leutheria
          persist-credentials: false
          sparse-checkout: |
            agent/agent/__init__.py
            agent/agent/skills/__init__.py
            agent/agent/skills/validate.py
            agent/agent/skills/template_skill.py
            agent/tool_catalog.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r base/requirements-ci.txt

      # Approved only if someone with write access (not the author) left an
      # APPROVED review whose commit_id is exactly HEAD_SHA, the commit that
      # is screened and then merged with --match-head-sha. Otherwise the
      # label is removed (so adding it again re-checks) and the PR is told why.
      - name: 0. Maintainer approval, bound to the head commit
        id: human
        if: env.LABEL != ''
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" > reviews.json
          python base/tools/human_approval.py candidates --reviews reviews.json \
            --head-sha "$HEAD_SHA" --author "$PR_AUTHOR" > candidates.txt
          : > perms.txt
          while read -r login; do
            perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" --jq .permission || echo none)
            echo "$login $perm" >> perms.txt
          done < candidates.txt
          python base/tools/human_approval.py verify --reviews reviews.json --head-sha "$HEAD_SHA" \
            --author "$PR_AUTHOR" --permissions perms.txt --out human.json
          approved=$(python -c "import json; print('yes' if json.load(open('human.json'))['approved'] is True else 'no')")
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
          if [ "$approved" != yes ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" >/dev/null 2>&1 || true
            python -c "import json, sys; print('The \`' + sys.argv[1] + '\` label was not acted on: ' + json.load(open('human.json'))['reason'] + '. Approve the PR (Review changes, Approve) at its current head, then add the label again.')" "$LABEL" > approval.md
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file approval.md
          fi

      - name: 1. Structural check
        id: structural
        run: |
          set +e
          python base/tools/check_submission.py --base before --head pr --leutheria leutheria \
            --author "$PR_AUTHOR" --out structural.json
          echo "ok=$([ $? -eq 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          python -c "import json; print('path=' + (json.load(open('structural.json'))['path'] or ''))" >> "$GITHUB_OUTPUT"

      - name: 2-3. Static analysis + Claude screener
        if: steps.structural.outputs.ok == 'yes'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL_PATH: ${{ steps.structural.outputs.path }}
        run: |
          python base/screen/screen.py "pr/$SKILL_PATH" \
            --catalog leutheria/agent/tool_catalog.json --out screen.json

      - name: 4. Decide
        env:
          HUMAN_OK: ${{ steps.human.outputs.approved }}
        run: |
          args="--structural structural.json --out decision.json"
          [ -f screen.json ] && args="$args --screen screen.json"
          if [ "$HUMAN_OK" = yes ]; then
            args="$args --human-approved"
            [ "$LABEL" = human-approved-override ] && args="$args --override-static-reject"
          fi
          python base/tools/decide.py $args
          python -c "import json; d = json.load(open('decision.json')); open('comment.md', 'w').write(d['comment'])"

      - name: Act on the decision
        id: act
        env:
          SKILL_PATH: ${{ steps.structural.outputs.path }}
        run: |
          action=$(python -c "import json; print(json.load(open('decision.json'))['action'])")
          verdict=$(python -c "import json; print(json.load(open('decision.json'))['verdict'] or '')")
          echo "merged=no" >> "$GITHUB_OUTPUT"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          case "$action" in
            close)
              gh pr close "$PR" --repo "$GITHUB_REPOSITORY" ;;
            review)
              gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-human-review ;;
            merge)
              # The structural check read the PR's base; main may have moved.
              # If another PR has since claimed this name, refuse before merging
              # (record_review.py checks again after, for the window in between).
              rm -rf owner-check
              git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" owner-check
              if ! python base/tools/record_review.py --repo owner-check --path "$SKILL_PATH" --verdict "$verdict" \
                  --author "$PR_AUTHOR" --check-owner-only; then
                gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "This name was published by someone else while this PR was open; please choose another name."
                gh pr close "$PR" --repo "$GITHUB_REPOSITORY"
                exit 0
              fi
              # --match-head-sha: merge exactly the commit that was screened.
              gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-sha "$HEAD_SHA"
              # Versions are assigned from main as it is when the record is
              # written; if another merge's record lands first the push is
              # rejected, so start again from the new main (version recomputed).
              screen_arg=""; [ -f screen.json ] && screen_arg="--screen $PWD/screen.json"
              for attempt in 1 2 3; do
                rm -rf main
                git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
                git -C main config user.name "leutheria-registry[bot]"
                git -C main config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                python base/tools/record_review.py --repo main --path "$SKILL_PATH" --verdict "$verdict" \
                  --author "$PR_AUTHOR" --pr "$PR" $screen_arg || exit 1
                git -C main add reviews
                git -C main commit --quiet -m "Review record for $SKILL_PATH (PR #$PR)"
                git -C main push --quiet origin HEAD:main && break
                [ "$attempt" = 3 ] && { echo "could not record the review; see README 'Recovering'"; exit 1; }
              done
              echo "merged=yes" >> "$GITHUB_OUTPUT" ;;
          esac

  # Pushes made with GITHUB_TOKEN don't trigger workflows, so publish is called.
  publish:
    needs: screen
    if: needs.screen.outputs.merged == 'yes'
    uses: ./.github/workflows/publish.yml
    secrets: inherit
