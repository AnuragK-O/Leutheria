# Withdraws one published version (manual; needs write access to dispatch).
# The file stays so installed copies still verify; the index marks it yanked.
name: yank

on:
  workflow_dispatch:
    inputs:
      name:
        description: Skill name
        required: true
      content_hash:
        description: content_hash of the version to withdraw
        required: true
      reason:
        description: Why (shown to maintainers; keep it short)
        required: true

permissions:
  contents: write

jobs:
  yank:
    runs-on: ubuntu-latest
    # Serialises yanks only. (GitHub keeps one queued run per group: a third
    # yank dispatched while one runs and one waits cancels the waiting one --
    # check the run list after dispatching several.) Review records landing at
    # the same moment are handled by yank_push.py's retry, not by a group.
    concurrency:
      group: registry-yank
      cancel-in-progress: false
    env:
      NAME: ${{ inputs.name }}
      HASH: ${{ inputs.content_hash }}
      REASON: ${{ inputs.reason }}
      ACTOR: ${{ github.actor }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # The checkout supplies the trusted scripts; the yank itself is applied to
      # a fresh main on every try and pushed as a fast-forward, with backoff, so
      # a burst of merges can't make the security response fail. Re-running is
      # safe: an already-yanked version counts as done.
      - name: Record the yank
        run: |
          python tools/yank_push.py \
            --remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --work yank-main --name "$NAME" --content-hash "$HASH" --reason "$REASON" --by "$ACTOR"

  publish:
    needs: yank
    uses: ./.github/workflows/publish.yml
    secrets: inherit
