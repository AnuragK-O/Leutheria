<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Leutheria Ghost Overlay</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent !important;
        pointer-events: none;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Ghost Cursor (Distinctive non-human AI guide pointer) */
      .ghost-cursor {
        position: absolute;
        top: 0;
        left: 0;
        width: 24px;
        height: 24px;
        pointer-events: none;
        transform: translate3d(-100px, -100px, 0);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 999999;
        display: none;
      }

      .ghost-cursor.visible {
        display: block;
      }

      .ghost-cursor-pointer {
        width: 16px;
        height: 16px;
        background: radial-gradient(circle, #a855f7 0%, #6366f1 100%);
        border: 2px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 16px 4px rgba(168, 85, 247, 0.7);
        position: relative;
      }

      .ghost-cursor-ring {
        position: absolute;
        top: -6px;
        left: -6px;
        width: 28px;
        height: 28px;
        border: 2px dashed rgba(168, 85, 247, 0.6);
        border-radius: 50%;
        animation: spin-pulse 3s linear infinite;
      }

      @keyframes spin-pulse {
        0% { transform: rotate(0deg) scale(0.9); opacity: 0.8; }
        50% { transform: rotate(180deg) scale(1.15); opacity: 1; }
        100% { transform: rotate(360deg) scale(0.9); opacity: 0.8; }
      }

      /* Target Bounding Box */
      .ghost-target-box {
        position: absolute;
        border: 2px solid #a855f7;
        background: rgba(168, 85, 247, 0.12);
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), inset 0 0 12px rgba(168, 85, 247, 0.2);
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        display: none;
        z-index: 999998;
      }

      .ghost-target-box.visible {
        display: block;
      }

      .ghost-target-label {
        position: absolute;
        top: -28px;
        left: 0;
        background: #1e1b2e;
        color: #f3e8ff;
        border: 1px solid #9333ea;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3px;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="ghost-target" class="ghost-target-box">
      <div id="ghost-label" class="ghost-target-label">Target</div>
    </div>

    <div id="ghost-cursor" class="ghost-cursor">
      <div class="ghost-cursor-pointer"></div>
      <div class="ghost-cursor-ring"></div>
    </div>

    <script>
      const { ipcRenderer } = require("electron");

      const cursorEl = document.getElementById("ghost-cursor");
      const targetBoxEl = document.getElementById("ghost-target");
      const labelEl = document.getElementById("ghost-label");

      ipcRenderer.on("ghost-update", (_event, data) => {
        if (!data || data.hide) {
          cursorEl.classList.remove("visible");
          targetBoxEl.classList.remove("visible");
          return;
        }

        const { x, y, width, height, label } = data;

        if (x !== undefined && y !== undefined) {
          cursorEl.style.transform = `translate3d(${x}px, ${y}px, 0)`;
          cursorEl.classList.add("visible");
        }

        if (width && height) {
          targetBoxEl.style.left = `${x}px`;
          targetBoxEl.style.top = `${y}px`;
          targetBoxEl.style.width = `${width}px`;
          targetBoxEl.style.height = `${height}px`;
          labelEl.textContent = label || "AI Target";
          targetBoxEl.classList.add("visible");
        } else {
          targetBoxEl.classList.remove("visible");
        }
      });
    </script>
  </body>
</html>
