<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Leutheria</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="../../assets/1.png" alt="" />
          <div class="brand-text">
            <span class="brand-name">Leutheria</span>
            <span class="brand-sub">voice assistant</span>
          </div>
        </div>

        <nav class="nav" id="nav"></nav>

        <div class="sidebar-footer">
          <div class="status" id="status" data-state="connecting">
            <span class="status-dot"></span>
            <span class="status-text">connecting</span>
          </div>
          <button class="icon-button" id="theme-toggle" title="Toggle appearance"></button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-heading">
            <h1 id="view-title"></h1>
            <p id="view-subtitle"></p>
          </div>
          <div class="topbar-actions" id="view-actions"></div>
        </header>

        <!-- Assistant -->
        <section class="view view-assistant" id="view-assistant">
          <div class="chat-scroll" id="chat-scroll">
            <div class="chat" id="chat"></div>
          </div>
          <div class="composer">
            <div class="composer-field">
              <input
                id="command-input"
                type="text"
                placeholder="Ask Leutheria to do something…"
                autocomplete="off"
                autofocus
              />
              <button class="mic-button" id="mic-button" title="Push to talk"></button>
            </div>
            <p class="composer-hint">
              <kbd>Enter</kbd> to send · click the mic to record, click again to send
            </p>
          </div>
        </section>

        <!-- Library -->
        <section class="view view-scroll" id="view-library" hidden>
          <div class="library">
            <div class="library-list" id="library-list"></div>
            <div class="library-detail" id="library-detail"></div>
          </div>
        </section>

        <!-- Activity -->
        <section class="view view-scroll" id="view-activity" hidden>
          <div class="stack" id="activity-body"></div>
        </section>

        <!-- Permissions -->
        <section class="view view-scroll" id="view-permissions" hidden>
          <div class="stack" id="permissions-body"></div>
        </section>

        <!-- Logs -->
        <section class="view view-logs" id="view-logs" hidden>
          <pre class="logs" id="logs"></pre>
        </section>
      </main>
    </div>

    <div class="toasts" id="toasts"></div>

    <script src="js/util.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/library.js"></script>
    <script src="js/activity.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/logs.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
