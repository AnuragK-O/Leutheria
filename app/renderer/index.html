<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Leutheria — dev console</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #1a1a1a;
        color: #eee;
        font-family: -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
      }

      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bubble {
        max-width: 75%;
        padding: 8px 12px;
        border-radius: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        line-height: 1.4;
      }
      .bubble.user {
        align-self: flex-end;
        background: #2b5fd9;
        color: white;
      }
      .bubble.assistant {
        align-self: flex-start;
        background: #333;
        color: #eee;
      }
      .bubble.confirm {
        border: 1px solid #a33;
        background: #3a2222;
      }
      .confirm-buttons {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .confirm-buttons button {
        flex: 1;
        padding: 6px 0;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      .confirm-buttons button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .confirm-buttons .approve {
        background: #2f8a3e;
        color: white;
      }
      .confirm-buttons .decline {
        background: #a33;
        color: white;
      }

      #input-row {
        display: flex;
        border-top: 1px solid #333;
      }
      #command-input {
        flex: 1;
        background: #111;
        color: #eee;
        font-family: -apple-system, sans-serif;
        font-size: 13px;
        border: none;
        padding: 10px 12px;
      }
      #command-input:focus {
        outline: none;
      }
      #mic-button {
        width: 44px;
        border: none;
        background: #111;
        color: #eee;
        font-size: 16px;
        cursor: pointer;
      }
      #mic-button.recording {
        background: #a33;
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      #log-toggle {
        background: #111;
        color: #888;
        font-size: 11px;
        font-family: monospace;
        border: none;
        border-top: 1px solid #333;
        padding: 4px 8px;
        text-align: left;
        cursor: pointer;
      }
      #log {
        height: 160px;
        overflow-y: auto;
        padding: 8px;
        background: #000;
        color: #0f0;
        font-family: monospace;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-all;
        border-top: 1px solid #333;
      }
      #log[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="chat"></div>
    <div id="input-row">
      <input id="command-input" type="text" placeholder="type a command and press enter…" autofocus />
      <button id="mic-button" title="click to start/stop recording">🎤</button>
    </div>
    <button id="log-toggle">▸ raw debug log</button>
    <div id="log" hidden></div>
    <script src="renderer.js"></script>
  </body>
</html>
